plugins {
    id "com.android.application"
}

android {
    namespace "com.psprecomp.vcs"
    compileSdk 36

    defaultConfig {
        applicationId "com.psprecomp.vcs"
        minSdk 26  // AAudio (audio_output_android.cpp) is API 26+
        targetSdk 35
        versionCode 2
        versionName "0.2.0-beta"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                // Release native code even in the debug APK: the ~180k AOT
                // functions at the Debug variant's -O0 run the game at ~10% speed.
                arguments "-DANDROID_STL=c++_static", "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-std=c++20"
            }
        }
    }

    ndkVersion "28.2.13676358"

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.22.1"
        }
    }
}
