plugins {
    id "com.android.application"
}

android {
    namespace "com.psprecomp.vcs"
    compileSdk 36

    defaultConfig {
        applicationId "com.psprecomp.vcs"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.1.0-dev"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
                cppFlags "-std=c++20"
            }
        }
    }

    ndkVersion "28.2.13676358"

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.22.1"
        }
    }
}
